<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio — Comic Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Work+Sans:wght@400;500;600;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbfaf6;
    --ink:#111111;
    --red:#e2222f;
    --blue:#1c3fb0;
    --yellow:#ffcf3d;
    --gray:#6d6a63;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans',sans-serif;
    line-height:1.55;
    overflow-x:hidden;
    background-image:radial-gradient(var(--ink) 0.6px, transparent 0.6px);
    background-size:14px 14px;
    background-position:-7px -7px;
  }

  ::selection{background:var(--yellow);color:var(--ink);}
  a{color:inherit;text-decoration:none;}
  :focus-visible{outline:3px solid var(--blue);outline-offset:2px;}

  .display{font-family:'Bangers',cursive;letter-spacing:0.02em;}
  .mono{font-family:'IBM Plex Mono',monospace;}
</style>
</head>

</body>
</html>
